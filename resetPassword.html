<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="resetPassword.css">
    <title>Reset Password - UDP Parking</title>
</head>

<header>
    <div class="logo"><a href="index.html">
      <img src="./images/logo.png" alt="Logo" />
  </a></div>
    <div class="features" id="features">  
    <div class="feature"><a href="./login.html"> Login </a></div>
    <div class="feature"><a href="./signup.html"> Sign up </a></div>
  </div>
</header>

<body>
<div class="prompt" id="prompt" style="display: none;"></div>
<div class="formcontainer">
<form method="post" action="https://backend.svrcd.xyz/entrypoint/pwreset.php" name="reset" id="form" onsubmit="apiCall('form'); return false;"><br /><br />
    <input id="uid" type="hidden" name="uid" />
    <input id="key" type="hidden" name="key" />
    <label><strong>Enter Your new password:</strong></label><br /><br />
    <input type="password" name="npwd" placeholder="Enter new password" /><br /><br />
    <label><strong>Confirm new password:</strong></label><br /><br />
    <input type="password" name="cpwd" placeholder="Confirm new password" /><br /><br />
    <div class = "loginbtn">
    <input type="submit" name="send" value="Reset Password" />
    </div>
</form>
</body>
<script src="/script/api.js"> </script> 
<script>
    var url = new URL(window.location.href);
    document.getElementById('uid').value = url.searchParams.get("uid");
    document.getElementById('key').value = url.searchParams.get("key");
 </script> 
</html>
